aid: dillards
name: Dillard's
url: >-
  https://raw.githubusercontent.com/api-evangelist/dillards/refs/heads/main/apis.yml
description: >-
  Dillard's, Inc. is a Little Rock, Arkansas department store chain selling apparel,
  footwear, cosmetics, handbags, menswear and home goods through its stores across the
  United States and dillards.com. Dillard's publishes no developer program, no OpenAPI,
  GraphQL, AsyncAPI, gRPC or SOAP contract, and no MCP or A2A agent surface — contract
  discovery on 2026-09-06 found every /.well-known/ and /openapi.json path answering with
  the storefront single-page-app shell under HTTP 200, matching a nonsense control path.
  Its two real machine-facing surfaces are a first-party llms.txt at
  https://www.dillards.com/llms.txt that maps the retail catalog for language models, and
  an ANSI ASC X12 EDI trading-partner program (810/816/820/832/850/856/860/864/997 over
  the OpenText/GXS VAN) whose implementation guide and vendor portal are gated behind a
  login on the Dillard's eBiz extranet.
